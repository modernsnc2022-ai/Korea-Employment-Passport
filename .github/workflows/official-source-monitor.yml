name: official-source-monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'monitor/sources.json'
      - 'monitor/source_hashes.json'
      - 'monitor/tls_pins.json'
      - 'monitor/reviewed_source_acceptance.json'
      - 'scripts/check_official_sources.py'
      - 'scripts/write_source_review_status.py'
      - 'scripts/diagnose_source_volatility.py'
      - 'scripts/diagnose_changed_source_text.py'
      - '.github/workflows/official-source-monitor.yml'
  workflow_dispatch:
    inputs:
      accept_current:
        description: 'Accept current official pages as the new reviewed baseline'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check official sources
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.accept_current }}" = "true" ]; then
            EXTRA="--accept-current"
          fi
          python scripts/check_official_sources.py --init-if-empty --review-manifest monitor/reviewed_source_acceptance.json $EXTRA

      - name: Read result
        id: result
        run: |
          echo "changed=$(jq '.changed | length' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "failures=$(jq '.failures | length' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "initialized=$(jq -r '.initialized' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "accepted=$(jq -r '.acceptedCurrent' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "review_manifest_accepted=$(jq -r '.reviewManifestAccepted // false' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "review_manifest_id=$(jq -r '.reviewManifestId // ""' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "acceptance_blocked=$(jq -r '.acceptanceBlocked // false' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "partial_acceptance=$(jq -r '.partialAcceptance // false' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "preserved_failures=$(jq '.preservedFailureSourceIds | length' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "pinned_fallbacks=$(jq '.pinnedFallbacks | length' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "curl_ca_fallbacks=$(jq '.curlCaVerifiedFallbacks | length' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "job_application_watch=$(jq '[.changed[] | select(.id == "kp2mi_gtog_korea_info_index")] | length' monitor/check_result.json)" >> "$GITHUB_OUTPUT"
          echo "myanmar_watch=$(jq '[.changed[] | select((.id // "") | startswith("mm_"))] | length' monitor/check_result.json)" >> "$GITHUB_OUTPUT"

      - name: Publish app review status
        run: python scripts/write_source_review_status.py

      - name: Diagnose changed KP2MI sources without auto-accepting
        if: steps.result.outputs.changed != '0' && steps.result.outputs.accepted != 'true'
        run: python scripts/diagnose_source_volatility.py --all

      - name: Diagnose changed Myanmar/Vietnam text
        if: steps.result.outputs.changed != '0' && steps.result.outputs.accepted != 'true'
        run: python scripts/diagnose_changed_source_text.py

      - name: Commit monitor state when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/source_hashes.json docs/data/source_review_status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update official source review state"
            git pull --rebase origin main
            git push
          fi

      - name: Open review issue when an official page changes
        if: steps.result.outputs.changed != '0' && steps.result.outputs.accepted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --search "Official source change detected in:title" --json number --jq '.[0].number // empty')
          cat > /tmp/body.txt <<'EOF'
          An official page used by Korea Employment Passport has changed.

          The app data has **not** been updated automatically.

          Review the latest official-source-monitor workflow result, compare the official notice with the currently published route/rules, update the structured data only after review, then run official-source-monitor with accept_current=true to approve the new baseline.

          This is intentionally human-gated.
          EOF
          if [ "${{ steps.result.outputs.job_application_watch }}" != "0" ]; then
            cat >> /tmp/body.txt <<'EOF'

          ## Priority: Manufacturing 2026 job-application watch

          The KP2MI G-to-G Korea information index changed. Check first whether KP2MI has published a **2026 Manufacturing e-certificate / online job-application notice**.

          If such a notice exists, verify it before changing rules and resolve these currently held questions only where the notice explicitly answers them:
          - required job-application documents (`job_docs`)
          - scan vs photo (`job_scan`)
          - identity/name/address source (`job_name`)
          - whether submitted data can be edited (`job_edit`)
          - what status/button proves final submission (`job_submit`)

          Do not copy the 2025 Manufacturing or 2026 Fisheries rules into Manufacturing 2026 unless the new official notice says so.
          EOF
          fi
          if [ "${{ steps.result.outputs.myanmar_watch }}" != "0" ]; then
            cat >> /tmp/body.txt <<'EOF'

          ## Priority: Myanmar Manufacturing promotion watch

          One or more official Myanmar/HRD Korea watch targets changed.

          Review the changed official artifact against `docs/data/mm_manufacturing_verification_2026.json` before any route promotion. Promotion remains blocked unless the reviewed artifact is:
          - from an allowed official source,
          - explicitly for the 2026 cycle,
          - explicitly labelled **Manufacturing**, and
          - a direct recruitment, registration, schedule, skills/result or final-result artifact.

          Do not promote from Agriculture/Livestock, Construction, Forestry, historical 2025 Manufacturing, older-cohort validity extensions, or a country-level Point System page without an explicit Manufacturing label.
          EOF
          fi
          if [ -z "$EXISTING" ]; then
            gh issue create --title "Official source change detected — review required" --body-file /tmp/body.txt
          else
            COMMENT="Another scheduled check detected official-source changes. Review the latest official-source-monitor run."
            if [ "${{ steps.result.outputs.job_application_watch }}" != "0" ]; then
              COMMENT="$COMMENT Priority: the KP2MI Korea info index changed; check for a 2026 Manufacturing online job-application notice and the five held job_application questions."
            fi
            if [ "${{ steps.result.outputs.myanmar_watch }}" != "0" ]; then
              COMMENT="$COMMENT Priority: Myanmar official watch targets changed; review the Manufacturing promotion gate before changing route status. Do not auto-promote."
            fi
            gh issue comment "$EXISTING" --body "$COMMENT"
          fi

      - name: Close resolved source-review issue
        if: steps.result.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --search "Official source change detected in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Reviewed source changes were accepted into the monitored baseline. Closing this review alert."
          fi

      - name: Job summary
        run: |
          echo "## Official source monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed: ${{ steps.result.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fetch failures: ${{ steps.result.outputs.failures }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Accepted reviewed baseline: ${{ steps.result.outputs.accepted }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reviewed manifest acceptance: ${{ steps.result.outputs.review_manifest_accepted }} (${{ steps.result.outputs.review_manifest_id }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Partial acceptance: ${{ steps.result.outputs.partial_acceptance }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed sources preserved on prior baseline: ${{ steps.result.outputs.preserved_failures }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Acceptance blocked: ${{ steps.result.outputs.acceptance_blocked }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pinned TLS fallbacks: ${{ steps.result.outputs.pinned_fallbacks }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CA-verified curl TLS compatibility fallbacks: ${{ steps.result.outputs.curl_ca_fallbacks }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Manufacturing 2026 job-application priority watch: ${{ steps.result.outputs.job_application_watch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Myanmar Manufacturing promotion watch: ${{ steps.result.outputs.myanmar_watch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auto-publish: **disabled**" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail blocked baseline acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.accept_current == true && steps.result.outputs.acceptance_blocked == 'true'
        run: |
          echo "Reviewed baseline was NOT accepted because one or more configured official sources could not be fetched."
          exit 1