name: static-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/app-runtime.js
          node --check docs/sw.js
      - name: Validate JSON data
        run: |
          node -e "JSON.parse(require('fs').readFileSync('docs/data/id_e9_manufacturing_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/id_e9_manufacturing_2026_rules.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/id_e9_manufacturing_2026_id.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/slc_guardian_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/workplace_reality_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/document_packs_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/exact_answer_rules_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/document_examples_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/freshness_policy_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/broker_question_catalog_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/form_wizards_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/form_lineage_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/source_review_status.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('monitor/tls_pins.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/visa_form_sources_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/visa_form_may26_comparison_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/visa_form_lineage_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/registration_sources_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/exam_card_source_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/manifest.webmanifest','utf8'))"
      - name: Check Python monitor scripts
        run: python -m py_compile scripts/check_official_sources.py scripts/write_source_review_status.py scripts/check_webapp_contract.py
      - name: Check webapp DOM and route contract
        run: python scripts/check_webapp_contract.py
      - name: Check required public files
        run: |
          test -f docs/index.html
          test -f docs/app.html
          test -f docs/privacy.html
          test -f docs/.nojekyll
