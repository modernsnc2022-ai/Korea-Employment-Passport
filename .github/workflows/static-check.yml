name: static-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/landing.js
          node --check docs/app-runtime.js
          node --check docs/beta.js
          node --check docs/sw.js
          node --check docs/country-pack.js
          node --check docs/readiness.js
      - name: Validate JSON data
        run: |
          node -e "JSON.parse(require('fs').readFileSync('docs/data/id_e9_manufacturing_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/id_e9_manufacturing_2026_rules.json','utf8'))"
