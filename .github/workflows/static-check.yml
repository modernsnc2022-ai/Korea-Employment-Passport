name: static-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/app-runtime.js
          node --check docs/beta.js
          node --check docs/sw.js
      - name: Validate JSON data
        run: |
          node -e "JSON.parse(require('fs').readFileSync('docs/data/id_e9_manufacturing_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/id_e9_manufacturing_2026_rules.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/id_e9_manufacturing_2026_id.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/slc_guardian_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/workplace_reality_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/workplace_worker_evidence_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/document_packs_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/exact_answer_rules_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/document_examples_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/freshness_policy_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/broker_question_catalog_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/form_wizards_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/form_lineage_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/source_review_status.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/official_help_channels_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/beta_program_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/beta_recruitment_sources_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/company_services_v1.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('recruitment/MANUFACTURING_LAUNCH_CHECK.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/data/departure_calls_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('monitor/tls_pins.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/visa_form_sources_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/visa_legacy_forms_field_audit_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/visa_form_may26_comparison_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/visa_form_lineage_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/registration_sources_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('research/exam_card_source_2026.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/manifest.webmanifest','utf8'))"
      - name: Check Python monitor scripts
        run: python -m py_compile scripts/check_official_sources.py scripts/write_source_review_status.py scripts/check_webapp_contract.py scripts/check_bqc_scopes.py scripts/check_beta_tracker.py scripts/check_beta_launch_readiness.py scripts/report_beta_progress.py scripts/assign_beta_slot.py scripts/parse_beta_interest.py scripts/record_beta_feedback.py scripts/record_zero_broker_evidence.py scripts/record_manufacturing_launch_check.py scripts/set_beta_release.py scripts/assign_worker_validator.py scripts/record_worker_interview.py scripts/publish_worker_evidence.py scripts/check_workplace_worker_evidence.py scripts/diagnose_source_volatility.py
      - name: Check webapp DOM and route contract
        run: python scripts/check_webapp_contract.py
      - name: Check zero-broker scope coverage
        run: python scripts/check_bqc_scopes.py
      - name: Check beta tracker privacy and 30+20 cohort slots
        run: python scripts/check_beta_tracker.py
      - name: Check beta prelaunch readiness
        run: python scripts/check_beta_launch_readiness.py --allow-source-review-pending
      - name: Self-test beta progress evidence aggregation
        run: python scripts/report_beta_progress.py --self-test
      - name: Report privacy-safe beta progress
        run: python scripts/report_beta_progress.py
      - name: Self-test beta interest parser
        run: python scripts/parse_beta_interest.py --self-test
      - name: Self-test beta slot assignment helper
        run: python scripts/assign_beta_slot.py --self-test
      - name: Self-test public beta feedback recorder
        run: python scripts/record_beta_feedback.py --self-test
      - name: Self-test follow-up zero-broker evidence recorder
        run: python scripts/record_zero_broker_evidence.py --self-test
      - name: Self-test Manufacturing launch-check recorder
        run: python scripts/record_manufacturing_launch_check.py --self-test
      - name: Self-test beta release-state helper
        run: python scripts/set_beta_release.py --self-test
      - name: Self-test E-9 worker panel release helper
        run: python scripts/set_worker_panel_release.py --self-test
      - name: Self-test E-9 worker validator assignment
        run: python scripts/assign_worker_validator.py --self-test
      - name: Self-test worker interview recorder
        run: python scripts/record_worker_interview.py --self-test
      - name: Self-test worker evidence publisher
        run: python scripts/publish_worker_evidence.py --self-test
      - name: Validate worker evidence privacy
        run: python scripts/check_workplace_worker_evidence.py
      - name: Check required public files
        run: |
          test -f docs/index.html
          test -f docs/app.html
          test -f docs/beta.html
          test -f docs/beta.css
          test -f docs/beta.js
          test -f docs/privacy.html
          test -f docs/COMPANY_COMMUNITY_ARCHITECTURE.md
          test -f docs/.nojekyll
