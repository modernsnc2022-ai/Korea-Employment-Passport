name: beta-launch-gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check strict beta launch readiness
        run: python scripts/check_beta_launch_readiness.py
