name: ui-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          nohup python3 -m http.server 4173 --directory docs > /tmp/kep-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/app.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kep-http.log
          exit 1
      - name: Run responsive smoke tests
        run: npm run test:ui
